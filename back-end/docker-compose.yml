version: '3.8'

services:
  db_manu:
    image: mysql:8.0
    container_name: mysql_db_manu
    restart: always
    environment:
      MYSQL_DATABASE: db_manu
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: