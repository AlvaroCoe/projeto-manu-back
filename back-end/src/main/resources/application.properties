spring.application.name=back-end

# ==========================================
# CONEX?O COM MYSQL
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/db_manu?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Driver do MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# PORTA DO SPRING BOOT
# ==========================================

server.port=8080

jwt.secret=chave-super-secreta-do-projeto-helpdesk-trocar-em-producao-2026-nao-compartilhar
jwt.expiration=86400000

file.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ==========================================
# E-MAIL (RECUPERAÇÃO DE SENHA)
# ==========================================
# Preencha com as credenciais reais do servidor SMTP que for usado.
# Exemplo abaixo usando Gmail (requer "senha de app", não a senha normal da conta).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=SEU_EMAIL_AQUI@gmail.com
spring.mail.password=SUA_SENHA_DE_APP_AQUI
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# E-mail que aparece como remetente das mensagens de recuperação de senha
app.mail.from=SEU_EMAIL_AQUI@gmail.com

# URL base do front-end, usada para montar o link de redefinição de senha
app.frontend-url=http://localhost:5173

# Tempo de validade do link/token de redefinição (minutos)
app.password-reset.expiration-minutes=30
# Intervalo mínimo entre duas solicitações para o mesmo usuário (segundos)
app.password-reset.cooldown-seconds=60